name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., latest, beta, next)"
        required: false
        default: "latest"
      dry-run:
        description: "Perform a dry run (no actual publish)"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.publish_context.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run
          echo "## Package Contents" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm pack --dry-run >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Determine publish context
        id: publish_context
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              NPM_TAG="$INPUT_TAG"
            else
              NPM_TAG="latest"
            fi
          else
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              NPM_TAG="next"
            else
              NPM_TAG="latest"
            fi
          fi

          if npm view "bitter-sql@${VERSION}" version >/dev/null 2>&1; then
            SHOULD_PUBLISH="false"
          else
            SHOULD_PUBLISH="true"
          fi

          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

          echo "Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "npm tag: ${NPM_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "needs publish: ${SHOULD_PUBLISH}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run publish (if enabled)
        if: ${{ github.event.inputs.dry-run == 'true' && steps.publish_context.outputs.should_publish == 'true' }}
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish — version already exists on npm
        if: ${{ steps.publish_context.outputs.should_publish != 'true' }}
        run: echo "Version ${{ steps.version.outputs.version }} is already published. Skipping npm publish."

      - name: Publish to npm
        if: ${{ github.event.inputs.dry-run != 'true' && steps.publish_context.outputs.should_publish == 'true' }}
        run: npm publish --tag "${{ steps.publish_context.outputs.npm_tag }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create package summary
        if: success()
        run: |
          echo "## ✅ Successfully Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** bitter-sql@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** https://www.npmjs.com/package/bitter-sql" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install bitter-sql@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  verify-publication:
    name: Verify npm Publication
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event.inputs.dry-run != 'true' && needs.publish.outputs.should_publish == 'true' }}

    steps:
      - name: Wait for npm registry update
        run: sleep 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get published version
        id: published
        run: |
          VERSION=$(npm view bitter-sql version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Test installation
        run: |
          mkdir test-install
          cd test-install
          npm init -y
          npm install bitter-sql@${{ steps.published.outputs.version }}

          # Test CLI
          npx bitter-sql --version

          # Test as library
          node -e "const { createScaffoldDatabase } = require('bitter-sql'); console.log('✅ Library import successful')"

      - name: Verification summary
        run: |
          echo "## ✅ Publication Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully installed and tested bitter-sql@${{ steps.published.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CLI execution: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Library import: ✅" >> $GITHUB_STEP_SUMMARY
